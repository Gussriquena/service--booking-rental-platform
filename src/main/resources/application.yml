spring:
  application:
    name: service--booking-rental-platform
    version: "@project.version@"
  profiles:
    active: dev
  datasource:
    driverClassName: org.h2.Driver
    url: jdbc:h2:mem:db:DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password: sa
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 5000
  servlet:
    context-path: /service--booking-rental-platform

flyway:
  schemas: rentalplatform
  table: flyway-rental-platform

springdoc:
  api-docs.enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  paths-to-match:
    - /api/**
    - /auth/**
    - /h2-console/**

cors:
  originPatterns: http://localhost:5000,http://localhost:3000,http://localhost:8080

security:
  jwt:
    token:
      secret-key: 53cr37
      expire-length: 3600000